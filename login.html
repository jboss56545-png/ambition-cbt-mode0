<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · Ambition CBT 2.0</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3404/3404134.png">
<style>
:root{--bg:#0b0d12;--card:#161a24;--card-2:#1c2130;--border:#252b3a;--text:#e8ecf5;--muted:#8b95ad;--accent:#6366f1;--accent-2:#a855f7;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.shell{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px;justify-content:center}
.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--card-2);border:1px solid var(--border)}
.mark svg{width:30px;height:30px;display:block}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand-name span{font-weight:500;color:var(--muted)}
.beta-pill{display:inline-block;margin:0 0 18px;padding:5px 11px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:rgba(168,85,247,.16);color:#c4b5fd;border:1px solid rgba(168,85,247,.35)}
h1{margin:0 0 6px;font-size:25px;font-weight:800;line-height:1.15}
.sub{margin:0 0 24px;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 10px 34px rgba(0,0,0,.45)}
label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 7px}
input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;margin-bottom:16px;transition:.15s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.16)}
input:disabled{opacity:.55}
button{width:100%;padding:15px;border:none;border-radius:12px;font-size:15.5px;font-weight:700;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));cursor:pointer;min-height:52px;transition:.15s}
button:active{transform:scale(.985)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.msg{margin-top:15px;padding:12px 14px;border-radius:11px;font-size:13.5px;line-height:1.45;display:none}
.msg.show{display:block}
.msg.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5}
.msg.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:#86efac}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.foot a{color:var(--accent-2);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" role="img">
        <path d="M20 3 37 33H29L20 17 11 33H3Z" fill="url(#g)"/>
        <path d="M20 22 26 33H14Z" fill="#0b0d12"/>
        <defs><linearGradient id="g" x1="4" y1="3" x2="36" y2="36">
          <stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a855f7"/>
        </linearGradient></defs>
      </svg>
    </span>
    <div class="brand-name">Ambition <span>CBT Mode</span></div>
  </div>

  <span class="beta-pill">Private Beta</span>
  <h1>Super Admin sign in</h1>
  <p class="sub">This environment is restricted. Only authorised administrators may continue.</p>

  <div class="card">
    <form id="form" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" inputmode="email"
             autocapitalize="none" spellcheck="false" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="btn" type="submit">Sign in</button>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </form>
  </div>

  <div class="foot">
    Powered by <a href="https://asviro-studio.vercel.app" target="_blank" rel="noopener">ASVIRO STUDIO ↗</a>
  </div>
</div>

<script>
(function () {
  'use strict';

  var form = document.getElementById('form');
  var emailEl = document.getElementById('email');
  var passEl = document.getElementById('password');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');

  function nextUrl() {
    var raw = new URLSearchParams(location.search).get('next');
    // Only allow same-origin relative paths — blocks open-redirect abuse.
    if (!raw || raw.charAt(0) !== '/' || raw.charAt(1) === '/' || raw.charAt(1) === '\\') return '/';
    return raw;
  }

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg show ' + kind;
  }

  function clear() {
    msg.textContent = '';
    msg.className = 'msg';
  }

  // Already signed in? Skip the form.
  fetch('/api/auth/session', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.authenticated) location.replace(nextUrl()); })
    .catch(function () {});

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clear();

    var email = emailEl.value.trim();
    var password = passEl.value;
    if (!email || !password) { show('Enter your email and password.', 'err'); return; }

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ email: email, password: password })
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
      .then(function (res) {
        if (res.status === 200 && res.data && res.data.ok) {
          show('Signed in. Redirecting…', 'ok');
          location.replace(nextUrl());
          return;
        }
        btn.disabled = false;
        btn.textContent = 'Sign in';
        passEl.value = '';
        show((res.data && res.data.message) || 'Sign in failed. Please try again.', 'err');
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Sign in';
        show('Network error. Check your connection and retry.', 'err');
      });
  });
})();
</script>
</body>
</html>
